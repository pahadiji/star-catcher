name: Update repo data

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["scripts/fetch_repos.py", "scripts/build_pages.py", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Claude repos from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_repos.py

      - name: Build SEO pages, badges, sitemap and RSS
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build_pages.py

      - name: Post one highlight to Bluesky / Mastodon (if configured)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: python scripts/social_post.py || true

      - name: Commit updated data
        run: |
          git config user.name "star-catcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/repos.json r c new advertise badge sitemap.xml robots.txt feed.xml promo
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Another run may have pushed meanwhile: rebase onto it and retry.
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi

      - name: Tell search engines about new pages (IndexNow)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/indexnow.py || true
